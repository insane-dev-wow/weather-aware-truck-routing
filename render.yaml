services:
  - type: web
    name: weather-truck-routing-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn config.wsgi:application --workers 1 --threads 4 --timeout 120"
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      # RENDER_EXTERNAL_HOSTNAME is added to ALLOWED_HOSTS by Django settings.
      - key: DJANGO_BEHIND_PROXY
        value: "True"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: GEOCODER_USER_AGENT
        sync: false
      - key: ROUTING_PROVIDER
        value: "valhalla"
      - key: ROUTING_CLIENT_ID
        sync: false
      - key: UPSTREAM_TIMEOUT
        value: "10"
      - key: ROUTING_TIMEOUT
        value: "15"
      - key: PYTHON_VERSION
        value: "3.12.7"
